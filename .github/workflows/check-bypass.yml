# 主要バイパス（IC のある一般国道）の判定の確認。地図データは作るだけで、公開はしない。
#
#  - 全国の OpenStreetMap のデータで判定をやり直し、採用した区間・不採用にした区間の一覧を実行結果（ログ）に出す。
#    一覧は Artifacts の bypass-report にも残る。
#  - 判定（BypassClassifier）・データ作成ツール（datatool）を変えたブランチ（claude/…）へ push すると自動で動く。
#    Actions 画面の「Run workflow」で手動実行もできる。
#  - 絞り込み（osmium tags-filter）は build-hwdb と同じにしておくこと。
name: check-bypass

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - "core/src/main/kotlin/com/example/highwaymode/core/graph/BypassClassifier.kt"
      - "core/src/main/kotlin/com/example/highwaymode/core/osm/**"
      - "datatool/**"
      - ".github/workflows/check-bypass.yml"

permissions:
  contents: read

concurrency:
  group: check-bypass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        run: chmod +x gradlew

      - name: Install osmium-tool
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool

      - name: Download Japan extract (Geofabrik)
        run: |
          curl -fL --retry 5 --retry-delay 30 -o japan.osm.pbf https://download.geofabrik.de/asia/japan-latest.osm.pbf
          ls -lh japan.osm.pbf

      - name: Filter highways (same as build-hwdb)
        run: |
          osmium tags-filter japan.osm.pbf \
            w/highway=motorway,motorway_link,trunk,trunk_link \
            w/toll=yes w/motorroad=yes \
            nwr/highway=services,rest_area \
            n/highway=motorway_junction,speed_camera n/barrier=toll_booth \
            nwr/amenity=fuel,charging_station,restaurant,fast_food,food_court,cafe,toilets,shower,atm,bank,information \
            nwr/shop nwr/tourism=information,hotel,motel,guest_house nwr/leisure=dog_park \
            -o filtered.osm.pbf --overwrite
          osmium add-locations-to-ways filtered.osm.pbf -o located.osm.gz -f osm.gz,locations_on_ways=true --overwrite
          rm -f japan.osm.pbf
          ls -lh filtered.osm.pbf located.osm.gz

      - name: Classify bypasses and print the report
        run: |
          ./gradlew --no-daemon -q :datatool:run --args="osm --in $PWD/located.osm.gz --check-only true --report $PWD/bypass-report.txt --report-lines 700 --report-area 34.55,136.70,35.25,137.60"

      - uses: actions/upload-artifact@v4
        with:
          name: bypass-report
          path: bypass-report.txt
          if-no-files-found: warn
